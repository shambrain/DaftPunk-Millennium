<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="gridTitle">
  <title id="gridTitle">Perspective grid floor</title>
  <defs>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb6ff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#5fb6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d6efff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
